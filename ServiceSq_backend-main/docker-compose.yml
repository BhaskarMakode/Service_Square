services:
  api:
    build: .
    ports:
      - "${DOCKER_API_PORT:-5000}:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/localconnect
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-secret}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:3000}
      SMS_PROVIDER: console
      SWAGGER_SERVER_URL: http://localhost:5000
    depends_on:
      - mongo
    volumes:
      - ./uploads:/app/uploads

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
